name: CPS2 program capacity prototype

# Installed at the existing dispatch-only build_cores.yml path on the isolated
# prototype branch. The production CPS+ branch and its workflow are unchanged.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: First Quartus seed
        default: '1'
      trials:
        description: Maximum fitter seeds per profile
        default: '2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, program]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select source and initialize required submodules
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PROFILE" = baseline ]; then
            git checkout --detach 8e73fb10ef1cb8a539ec94db2a0f68ef89eb689c
          fi
          git submodule update --init modules/fx68k modules/jtdsp16 modules/jteeprom
          git rev-parse HEAD
          git submodule status modules/fx68k modules/jtdsp16 modules/jteeprom
      - name: Compile and check timing
        env:
          PROFILE: ${{ matrix.profile }}
          SEED: ${{ inputs.seed }}
          TRIALS: ${{ inputs.trials }}
        run: |
          extra=''
          if [ "$PROFILE" = program ]; then extra='-d CPS2_PRG8'; fi
          docker run --rm --platform linux/amd64 --network host \
            -e CORE=cps2 -e SKIP_STOCK=1 -e SEED="$SEED" -e TRIALS="$TRIALS" \
            -e JTCORE_EXTRA="$extra" -v "$PWD":/jtcores \
            jotego/jtcore20@sha256:58a69912d36b33952253c6c7245bf80ada8ae000084a03e6479d46e9e913baec \
            bash /jtcores/.github/scripts/fitter_ab.sh /jtcores /jtcores/fitter_results
      - name: Name prototype distinctly from production cores
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          src=fitter_results/cpsplus/jtcps2.rbf
          if [ -f "$src" ]; then
            cp "$src" "fitter_results/jtcps2-prg8-$PROFILE.rbf"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cps2-prg8-${{ matrix.profile }}
          path: fitter_results
          retention-days: 30
          if-no-files-found: error
