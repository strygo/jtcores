name: CPS2 unified development

on:
  workflow_dispatch:
    inputs:
      seed:
        description: First Quartus seed
        default: '1'
      trials:
        description: Maximum fitter seeds
        default: '2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete source provenance
        run: |
          git submodule update --init modules/fx68k modules/jtdsp16 modules/jteeprom
          python3 modules/cpsplus/evolution-unified/verify_export.py --root "$PWD"
          git rev-parse HEAD
          git submodule status modules/fx68k modules/jtdsp16 modules/jteeprom
      - name: Compile one unified core and check timing
        env:
          SEED: ${{ inputs.seed }}
          TRIALS: ${{ inputs.trials }}
        run: |
          extra='-d CPS2_PRG8 -d CPS2_OBJEXT -d CPS2_QSND24 -d JTFRAME_SDRAM_XL -u JTFRAME_SDRAM_LARGE -d CPS2_GFX64 -d CPS2_SCREXT -d CPS2_NATIVE128 -d CPS2_QSND32 -d CPS2_UNIFIED -d CPSPLUS_EXTENT -u JTFRAME_LF_BUFFER'
          docker run --rm --platform linux/amd64 --network host \
            -e CORE=cps2 -e SKIP_STOCK=1 -e SEED="$SEED" -e TRIALS="$TRIALS" \
            -e JTCORE_EXTRA="$extra" -v "$PWD":/jtcores \
            jotego/jtcore20@sha256:58a69912d36b33952253c6c7245bf80ada8ae000084a03e6479d46e9e913baec \
            /jtcores/.github/scripts/fitter_ab.sh /jtcores /jtcores/fitter_results
      - name: Name the candidate and include provenance
        if: always()
        run: |
          src=fitter_results/cpsplus/jtcps2.rbf
          if [ -f "$src" ]; then
            sudo cp "$src" fitter_results/jtcps2-cpsplus-unified.rbf
          fi
          if [ -d fitter_results ]; then
            sudo cp modules/cpsplus/evolution-unified/export_manifest.json fitter_results/source_manifest.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cps2-unified
          path: fitter_results
          retention-days: 30
          if-no-files-found: error
