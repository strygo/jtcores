name: CPS2 native capacity development

# This replaces the dispatch-only workflow only on the separate native-capacity
# branch. Production and the earlier VS2A prototype branch are untouched.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: First Quartus seed
        default: '1'
      trials:
        description: Maximum fitter seeds per profile
        default: '2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profile: [prototype, native128]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify complete source provenance
        run: |
          git submodule update --init modules/fx68k modules/jtdsp16 modules/jteeprom
          python3 modules/cpsplus/evolution-capacity/verify_export.py --root "$PWD"
          git rev-parse HEAD
          git submodule status modules/fx68k modules/jtdsp16 modules/jteeprom
      - name: Compile and check timing
        env:
          PROFILE: ${{ matrix.profile }}
          SEED: ${{ inputs.seed }}
          TRIALS: ${{ inputs.trials }}
        run: |
          extra='-d CPS2_PRG8 -d CPS2_OBJEXT -d CPS2_QSND24 -d JTFRAME_SDRAM_XL -u JTFRAME_SDRAM_LARGE'
          if [ "$PROFILE" = native128 ]; then
            extra="$extra -d CPS2_GFX64 -d CPS2_SCREXT -d CPS2_NATIVE128"
          fi
          docker run --rm --platform linux/amd64 --network host \
            -e CORE=cps2 -e SKIP_STOCK=1 -e SEED="$SEED" -e TRIALS="$TRIALS" \
            -e JTCORE_EXTRA="$extra" -v "$PWD":/jtcores \
            jotego/jtcore20@sha256:58a69912d36b33952253c6c7245bf80ada8ae000084a03e6479d46e9e913baec \
            /jtcores/.github/scripts/fitter_ab.sh /jtcores /jtcores/fitter_results
      - name: Name development cores distinctly
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          src=fitter_results/cpsplus/jtcps2.rbf
          if [ -f "$src" ]; then
            sudo cp "$src" "fitter_results/jtcps2-capacity-$PROFILE.rbf"
          fi
          if [ -d fitter_results ]; then
            sudo cp modules/cpsplus/evolution-capacity/export_manifest.json fitter_results/source_manifest.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cps2-capacity-${{ matrix.profile }}
          path: fitter_results
          retention-days: 30
          if-no-files-found: error
