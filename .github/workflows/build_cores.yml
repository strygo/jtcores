name: CPS+ core build

# Release-style build: the three CPS cores with -d CPSPLUS, RBFs uploaded as
# artifacts.  Half the compile time of the fitter A/B (one leg per core);
# use the A/B workflow when the question is timing cost, this one when the
# deliverable is the cores.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Quartus fitter seed
        required: false
        default: "1"
      dbg:
        description: 'visual CPSPLUS_DBG overlay (1 = build with -d CPSPLUS_DBG)'
        required: false
        default: ""
      trials:
        description: 'seeds tried per leg until STA closes (seed, seed+1, ...)'
        required: false
        default: "4"

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned amd64 (jtcore20 image is amd64-only)
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        core: [cps1, cps15, cps2]
    steps:
      - uses: actions/checkout@v4

      - name: Init public submodules (per-path, robust)
        run: |
          for p in $(git submodule status | awk '{print $2}'); do
            git submodule update --init --force "$p" 2>/dev/null && echo "ok   $p" || echo "skip $p (ssh/private?)"
          done
          fail=0
          for f in modules/fx68k/cfg/files.yaml modules/jtdsp16/hdl modules/jteeprom/hdl; do
            [ -e "$f" ] || { echo "FATAL: required submodule content missing: $f" >&2; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      - name: Pre-flight -- module file set
        run: |
          rc=0
          for f in $(grep -o 'cpsplus_[A-Za-z0-9_]*\.v' cores/${{ matrix.core }}/cfg/files.yaml | sort -u); do
            [ -f "modules/cpsplus/hdl/$f" ] || { echo "FAIL: modules/cpsplus/hdl/$f missing" >&2; rc=1; }
          done
          exit $rc

      - name: Build ${{ matrix.core }} with CPSPLUS
        env:
          SEED: ${{ inputs.seed }}
          CORE: ${{ matrix.core }}
          CPSPLUS_DBG: ${{ inputs.dbg }}
          TRIALS: ${{ inputs.trials }}
          SKIP_STOCK: "1"
        run: |
          docker run --rm --platform linux/amd64 --network host \
            -e SEED="$SEED" \
            -e CORE="$CORE" \
            -e CPSPLUS_DBG="$CPSPLUS_DBG" \
            -e TRIALS="$TRIALS" \
            -e SKIP_STOCK="$SKIP_STOCK" \
            -v "$PWD":/jtcores \
            jotego/jtcore20 \
            /jtcores/.github/scripts/fitter_ab.sh /jtcores /jtcores/fitter_results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jt${{ matrix.core }}-cpsplus
          path: |
            fitter_results/cpsplus/jt${{ matrix.core }}_cpsplus.rbf
            fitter_results/cpsplus/worst_slack.txt
            fitter_results/manifest.txt
          retention-days: 30
          if-no-files-found: error
